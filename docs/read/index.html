<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Read — Aperio Bible</title>
<meta name="description" content="Read the New Clavis Translation online with the Aperio Study Center — commentary in three voices, cross references, and the original languages." />
<style>
  :root {
    --bg:#F7F7F8; --card:#FFF; --border:#D8DEE9; --navy:#122344; --ink:#1D2438;
    --muted:#6C7689; --faint:#98A1B3; --gold:#C4952A; --gold-deep:#9A6E1A;
    --blue:#D9E3F2; --sheet:#ECEDEF; --chip:#E2E4E8;
    --serif: Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  body { background:var(--bg); color:var(--ink); font-family:var(--sans); overflow-x:hidden; }
  a { color:inherit; text-decoration:none; }
  button { font-family:var(--sans); border:none; background:none; cursor:pointer; }

  /* Reading progress */
  .progress { position: fixed; top: 0; left: 0; height: 3px; width: 0%; z-index: 60;
    background: linear-gradient(90deg, var(--gold-deep), var(--gold)); transition: width .15s linear; }

  /* Header */
  header {
    transition: transform .35s cubic-bezier(.22,.61,.36,1);
  }
  header.hide { transform: translateY(-110%); }
  header {
    position: sticky; top: 0; z-index: 30;
    display:flex; align-items:center; justify-content:space-between;
    padding: 12px 16px; background: rgba(247,247,248,.9);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid #E3E0D8;
  }
  .h-side { width: 84px; display:flex; align-items:center; gap:10px; }
  .h-side.right { justify-content:flex-end; }
  .back { font-size: 20px; color: var(--navy); }
  .h-mid { text-align:center; cursor:pointer; }
  .h-title { font-family:var(--serif); font-weight:700; font-size: 19px; color:var(--navy); }
  .h-title .num { color: var(--gold); }
  .h-sub { font-size: 10.5px; color: var(--faint); margin-top: 1px; }
  .nct { background:#fff; border:1px solid #E3E0D8; border-radius: 12px; padding: 5px 10px; font-size: 11.5px; font-weight: 700; color: var(--navy); white-space: nowrap; }

  /* Reader column */
  main { max-width: 680px; margin: 0 auto; padding: 26px 22px 170px; }
  .kick { font-size: 11px; letter-spacing: 2.5px; color: var(--faint); font-weight: 600; }
  .chnum {
    position: absolute; top: -30px; right: -8px; font-family: var(--serif); font-weight: 700;
    font-size: clamp(9rem, 22vw, 15rem); line-height: 1; color: rgba(18,35,68,.045);
    pointer-events: none; user-select: none; z-index: 0;
  }
  .chapter-head { position: relative; }
  .verse.v1::first-letter {
    font-family: var(--serif); font-size: 3.4em; font-weight: 700; color: var(--gold-deep);
    float: left; line-height: .82; padding-right: 8px; padding-top: 4px;
  }
  .bookname { font-family: var(--serif); font-weight: 700; font-size: clamp(2rem, 6vw, 2.6rem); color: var(--navy); margin: 4px 0 18px; }
  .verse { font-family: var(--serif); font-size: 1.15rem; line-height: 1.95; color: var(--ink); margin-bottom: 14px; }
  .verse sup { color: var(--gold); font-size: .62em; font-weight: 700; margin-right: 3px; }
  .navrow { display:flex; gap: 10px; margin-top: 34px; }
  .navcard {
    flex:1; background: var(--card); border:1px solid var(--border); border-radius: 14px; padding: 12px 16px;
    transition: transform .25s, box-shadow .25s;
  }
  .navcard:hover { transform: translateY(-3px); box-shadow: 0 10px 22px rgba(18,35,68,.1); }
  .navcard .s { font-size: 11.5px; color: var(--faint); }
  .navcard .b { font-family: var(--serif); font-weight:700; font-size: 15px; color: var(--navy); margin-top: 2px; }
  .navcard.next { text-align: right; }
  .fade-in { animation: fadeUp .5s cubic-bezier(.22,.61,.36,1); }
  @keyframes fadeUp { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform: none; } }

  /* Study Center pill */
  .sc-pill {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 22px; z-index: 25;
    background: var(--bg); border: 1.5px solid var(--navy); border-radius: 26px;
    padding: 13px 26px; font-size: 14px; font-weight: 700; color: var(--navy); letter-spacing: .4px;
    box-shadow: 0 4px 12px rgba(13,26,48,.18);
    animation: breathe 2.4s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.05); } }
  .sc-pill:active { transform: translateX(-50%) scale(.95); }

  /* Study Center sheet */
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    height: 64vh; max-height: 92vh; background: var(--sheet);
    border-radius: 26px 26px 0 0; box-shadow: 0 -10px 30px rgba(13,26,48,.24);
    transform: translateY(105%); transition: transform .45s cubic-bezier(.32,.72,.22,1), height .35s ease;
    display: flex; flex-direction: column;
  }
  .sheet.open { transform: translateY(0); }
  .sheet.full { height: 92vh; }
  .sheet-head { padding: 10px 18px 0; }
  .handle { width: 44px; height: 4px; background: var(--gold-deep); border-radius: 2px; margin: 0 auto 10px; cursor: pointer; }
  .sc-top { display:flex; justify-content:space-between; align-items:center; }
  .sc-label { font-size: 10.5px; letter-spacing: 2px; font-weight: 700; color: var(--gold-deep); }
  .sc-label span { color: var(--muted); letter-spacing: 0; font-weight: 400; }
  .sc-btns { display:flex; gap: 16px; color: var(--ink); font-size: 15px; }
  .sc-btns button { color: var(--ink); font-size: 15px; }
  .tabs { display:flex; gap: 18px; border-bottom: 1px solid #DCDEE2; margin-top: 10px; font-size: 13.5px; overflow-x: auto; scrollbar-width: none; }
  .tab { color: var(--muted); padding-bottom: 9px; white-space: nowrap; }
  .tab.on { font-weight: 700; color: var(--navy); border-bottom: 2px solid var(--gold-deep); }
  .sheet-body { flex: 1; overflow-y: auto; padding: 14px 18px calc(30px + env(safe-area-inset-bottom)); }
  .tones { display:flex; background: var(--chip); border-radius: 20px; padding: 4px; margin-bottom: 14px; }
  .tone { flex:1; text-align:center; padding: 8px 0; font-size: 9.5px; letter-spacing: 1px; font-weight: 600; color: var(--muted); border-radius: 16px; transition: background .25s, color .25s; }
  .tone.on { background: var(--navy); color: #fff; }
  .com-h { font-family: var(--serif); font-weight: 700; font-size: 1.25rem; color: var(--navy); line-height: 1.35; margin-bottom: 10px; }
  .com-p { font-family: var(--serif); font-size: .96rem; line-height: 1.8; color: var(--ink); margin-bottom: 12px; }
  .vrow { background: var(--card); border:1px solid var(--border); border-radius: 12px; padding: 11px 13px; margin-bottom: 7px; font-family: var(--serif); font-size: .93rem; line-height: 1.65; cursor: pointer; transition: transform .2s; }
  .vrow:hover { transform: translateX(4px); }
  .vrow b { color: var(--gold-deep); font-size: .75rem; margin-right: 5px; }
  .xrow { display:flex; justify-content:space-between; align-items:center; background: var(--card); border:1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 7px; cursor: pointer; transition: transform .2s; }
  .xrow:hover { transform: translateX(4px); }
  .xrow .lbl { font-weight: 700; font-size: 13px; color: var(--gold-deep); }
  .xrow .arr { color: var(--faint); }
  .lex-in { width: 100%; background: var(--card); border: 1.5px solid var(--border); border-radius: 12px; padding: 13px 14px; font-size: 15px; font-family: var(--sans); color: var(--ink); outline: none; margin-bottom: 10px; }
  .lex-in:focus { border-color: var(--navy); }
  .lex { background: var(--card); border:1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 7px; }
  .lex .top { display:flex; justify-content: space-between; align-items: baseline; }
  .lex .lem { font-family: var(--serif); font-weight: 700; font-size: 1.05rem; color: var(--navy); }
  .lex .tr { font-style: italic; color: var(--muted); font-size: .8rem; margin-left: 8px; }
  .lex .sid { font-size: .72rem; font-weight: 700; color: var(--gold-deep); }
  .lex .def { font-size: .85rem; color: var(--ink); line-height: 1.6; margin-top: 5px; }
  .hint { text-align:center; color: var(--faint); font-size: .85rem; margin-top: 20px; }
  .backlink { display:inline-flex; gap: 6px; align-items:center; font-size: 13px; font-weight: 700; color: var(--gold-deep); margin-bottom: 12px; cursor: pointer; }
  .fverse { background: var(--blue); border-left: 3px solid var(--gold-deep); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  .fverse .fr { font-size: 10.5px; letter-spacing: 1.5px; font-weight: 700; color: var(--gold-deep); margin-bottom: 5px; }
  .fverse .ft { font-family: var(--serif); font-size: 1rem; line-height: 1.75; color: var(--ink); }

  /* Passage picker */
  .picker { position: fixed; inset: 0; z-index: 60; background: var(--bg); transform: translateY(100%); transition: transform .4s cubic-bezier(.32,.72,.22,1); overflow-y: auto; }
  .picker.open { transform: translateY(0); }
  .pick-head { position: sticky; top:0; display:flex; justify-content:space-between; align-items:center; padding: 16px 20px; background: rgba(247,247,248,.94); backdrop-filter: blur(10px); border-bottom: 1px solid #E3E0D8; z-index: 2; }
  .pick-head .t { font-family: var(--serif); font-weight:700; font-size: 18px; color: var(--navy); }
  .pick-head button { font-size: 14px; font-weight: 600; color: var(--muted); }
  .pick-body { max-width: 680px; margin: 0 auto; padding: 18px 20px 60px; }
  .test-h { font-size: 10.5px; letter-spacing: 2.5px; font-weight: 700; color: var(--faint); margin: 18px 0 10px; }
  .bookrow { display:flex; justify-content: space-between; align-items:center; background: var(--card); border:1px solid var(--border); border-radius: 12px; padding: 13px 16px; margin-bottom: 7px; cursor:pointer; transition: transform .2s; }
  .bookrow:hover { transform: translateX(5px); }
  .bookrow .n { font-family: var(--serif); font-weight: 600; font-size: 15px; color: var(--ink); }
  .bookrow .ct { font-size: 12px; color: var(--faint); }
  .chgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 8px; margin-top: 14px; }
  .chbtn { aspect-ratio: 1; background: var(--card); border: 1px solid var(--border); border-radius: 12px; font-family: var(--serif); font-weight: 600; font-size: 16px; color: var(--ink); transition: background .2s, transform .2s; }
  .chbtn:hover { background: var(--blue); transform: scale(1.06); }
  .scrim { position: fixed; inset: 0; z-index: 35; background: rgba(18,35,68,.28); opacity: 0; pointer-events: none; transition: opacity .4s; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  /* ---------- Desktop: Study Center as a side panel ---------- */
  main { transition: margin .45s cubic-bezier(.32,.72,.22,1); }
  @media (min-width: 900px) {
    .sheet {
      top: 0; bottom: 0; left: auto; right: 0;
      width: min(440px, 44vw); height: 100vh; max-height: none;
      border-radius: 0; border-left: 1px solid var(--border);
      box-shadow: -14px 0 34px rgba(13,26,48,.14);
      transform: translateX(105%);
    }
    .sheet.open { transform: translateX(0); }
    .sheet.full { height: 100vh; }
    .handle, #sc-size { display: none; }
    .scrim { display: none; }
    .sheet-head { padding-top: 18px; }
    body.sc-on main {
      margin-right: calc(min(440px, 44vw) + 24px);
      margin-left: max(2.5vw, calc((100vw - min(440px, 44vw) - 24px - 680px) / 2));
    }
    body.sc-on .sc-pill { display: none; }
    .sc-pill { bottom: 30px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="progress" id="progress"></div>
<header id="hdr">
  <div class="h-side"><a class="back" href="../index.html" aria-label="Back to aperiobible.app">←</a></div>
  <div class="h-mid" id="picker-open">
    <div class="h-title" id="h-title">Aperio <span class="num"></span></div>
    <div class="h-sub">Tap to change passage</div>
  </div>
  <div class="h-side right"><span class="nct">NCT</span></div>
</header>

<main id="main"></main>

<button class="sc-pill" id="sc-open">Study Center</button>
<div class="scrim" id="scrim"></div>

<div class="sheet" id="sheet" role="dialog" aria-label="Study Center">
  <div class="sheet-head">
    <div class="handle" id="handle"></div>
    <div class="sc-top">
      <div class="sc-label">STUDY CENTER <span id="sc-ref"></span></div>
      <div class="sc-btns">
        <button id="sc-size" aria-label="Expand">↑</button>
        <button id="sc-close" aria-label="Close">✕</button>
      </div>
    </div>
    <div class="tabs" id="tabs">
      <div class="tab on" data-t="com">Commentary</div>
      <div class="tab" data-t="verses">Verses</div>
      <div class="tab" data-t="lex">Lexicon</div>
      <div class="tab" data-t="xr">Cross Refs</div>
    </div>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</div>

<div class="picker" id="picker">
  <div class="pick-head">
    <div class="t" id="pick-title">Go to passage</div>
    <button id="pick-close">Close</button>
  </div>
  <div class="pick-body" id="pick-body"></div>
</div>

<script>
var BOOKS = [], CH = null, TONE = 'd', TAB = 'com', FOCUS = null, STRONGS = null;

function qs(id){ return document.getElementById(id); }
function esc(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function loadState(){
  var h = location.hash.replace('#','').split('.');
  if (h.length === 2 && +h[0] && +h[1]) return [+h[0], +h[1]];
  try { var s = JSON.parse(localStorage.getItem('aperio:last')); if (s && s.b) return [s.b, s.c]; } catch(e){}
  return [43, 1];
}

function go(b, c, push){
  fetch('data/' + b + '/' + c + '.json').then(function(r){ return r.json(); }).then(function(data){
    CH = data; FOCUS = null;
    location.hash = b + '.' + c;
    try { localStorage.setItem('aperio:last', JSON.stringify({b:b, c:c})); } catch(e){}
    renderChapter(); renderSheet();
    window.scrollTo({ top: 0 });
  });
}

function bookOf(n){ for (var i=0;i<BOOKS.length;i++) if (BOOKS[i].n===n) return BOOKS[i]; return null; }

function renderChapter(){
  qs('h-title').innerHTML = esc(CH.name) + ' <span class="num">' + CH.c + '</span> ▾';
  qs('sc-ref').textContent = '· ' + CH.name + ' ' + CH.c;
  var bk = bookOf(CH.b);
  var html = '<div class="fade-in"><div class="chapter-head"><div class="chnum">' + CH.c + '</div>' +
    '<div class="kick">CHAPTER ' + CH.c + '</div>' +
    '<div class="bookname">' + esc(CH.name) + '</div></div>';
  CH.v.forEach(function(v, i){
    html += '<p class="verse' + (i === 0 ? ' v1' : '') + '"><sup>' + v[0] + '</sup>' + esc(v[1]).replace(/\n/g,' ') + '</p>';
  });
  html += '<div class="navrow">';
  if (CH.c > 1) html += '<div class="navcard" onclick="go(' + CH.b + ',' + (CH.c-1) + ')"><div class="s">← Previous</div><div class="b">' + esc(CH.name) + ' ' + (CH.c-1) + '</div></div>';
  if (bk && CH.c < bk.ch) html += '<div class="navcard next" onclick="go(' + CH.b + ',' + (CH.c+1) + ')"><div class="s">Next →</div><div class="b">' + esc(CH.name) + ' ' + (CH.c+1) + '</div></div>';
  html += '</div></div>';
  qs('main').innerHTML = html;
}

/* ---------- Study Center ---------- */
function comHtml(txt){
  if (!txt) return '<p class="hint">Commentary for this chapter is on its way.</p>';
  var out = '';
  txt.split(/\n{2,}/).forEach(function(b){
    b = b.trim(); if (!b) return;
    if (/^#{1,3}\s/.test(b)) out += '<div class="com-h">' + esc(b.replace(/^#{1,3}\s*/,'')) + '</div>';
    else out += '<p class="com-p">' + esc(b.replace(/\*\*([^*]+)\*\*/g,'$1').replace(/\*([^*]+)\*/g,'$1').replace(/\n/g,' ')) + '</p>';
  });
  return out;
}
function tonesHtml(){
  var t = [['d','🙏 DEVOTIONAL'],['s','🎓 SCHOLARLY'],['p','🔥 PROPHETIC']];
  return '<div class="tones">' + t.map(function(x){
    return '<div class="tone' + (TONE===x[0]?' on':'') + '" onclick="setTone(\'' + x[0] + '\')">' + x[1] + '</div>';
  }).join('') + '</div>';
}
function setTone(t){ TONE = t; renderSheet(); }
function setTab(t){ TAB = t; FOCUS = null;
  document.querySelectorAll('.tab').forEach(function(el){ el.classList.toggle('on', el.getAttribute('data-t')===t); });
  renderSheet();
}
function focusVerse(v){ FOCUS = v; renderSheet(); }

function renderSheet(){
  if (!CH) return;
  var body = qs('sheet-body'), html = '';
  if (TAB === 'com'){
    html = tonesHtml() + comHtml(CH.com[TONE]);
  } else if (TAB === 'verses'){
    if (FOCUS !== null){
      var vv = null; CH.v.forEach(function(x){ if (x[0]===FOCUS) vv = x[1]; });
      html = '<div class="backlink" onclick="focusVerse(null)">← All verses</div>' +
        '<div class="fverse"><div class="fr">' + esc(CH.name) + ' ' + CH.c + ':' + FOCUS + '</div><div class="ft">' + esc(vv||'') + '</div></div>' +
        tonesHtml() + comHtml(CH.com[TONE]);
    } else {
      html = CH.v.map(function(v){
        return '<div class="vrow" onclick="focusVerse(' + v[0] + ')"><b>' + v[0] + '</b>' + esc(v[1]).replace(/\n/g,' ') + '</div>';
      }).join('');
    }
  } else if (TAB === 'xr'){
    html = CH.xr.length ? CH.xr.map(function(x){
      return '<div class="xrow" onclick="go(' + x[0] + ',' + x[1] + ')"><span class="lbl">' + esc(x[2]) + '</span><span class="arr">→</span></div>';
    }).join('') : '<p class="hint">No cross references for this chapter yet.</p>';
  } else if (TAB === 'lex'){
    html = '<input class="lex-in" id="lexq" placeholder=\'Search Hebrew or Greek — "agape", H1254\' oninput="lexSearch(this.value)" />' +
      '<div id="lexout"><p class="hint">14,197 entries from Strong&#39;s lexicon — search by word, transliteration, or number.</p></div>';
  }
  body.innerHTML = html;
  body.scrollTop = 0;
  if (TAB === 'lex' && !STRONGS){
    fetch('data/strongs.json').then(function(r){ return r.json(); }).then(function(d){ STRONGS = d; });
  }
}

function lexSearch(q){
  var out = qs('lexout'); q = q.trim().toLowerCase();
  if (q.length < 2){ out.innerHTML = '<p class="hint">Keep typing…</p>'; return; }
  if (!STRONGS){ out.innerHTML = '<p class="hint">Loading lexicon…</p>'; return; }
  var hits = [];
  for (var i=0; i<STRONGS.length && hits.length<25; i++){
    var e = STRONGS[i];
    if (e.id.toLowerCase() === q || e.t.toLowerCase().indexOf(q) !== -1 ||
        e.l.toLowerCase().indexOf(q) !== -1 || e.d.toLowerCase().indexOf(q) !== -1 || e.k.toLowerCase().indexOf(q) !== -1){
      hits.push(e);
    }
  }
  out.innerHTML = hits.length ? hits.map(function(e){
    return '<div class="lex"><div class="top"><span><span class="lem">' + esc(e.l) + '</span><span class="tr">' + esc(e.t) + '</span></span><span class="sid">' + esc(e.id) + '</span></div><div class="def">' + esc(e.d || e.k) + '</div></div>';
  }).join('') : '<p class="hint">No matches.</p>';
}

/* Sheet open/close */
var sheet = qs('sheet'), scrim = qs('scrim');
function openSheet(){ sheet.classList.add('open'); scrim.classList.add('on'); document.body.classList.add('sc-on'); }
function closeSheet(){ sheet.classList.remove('open','full'); scrim.classList.remove('on'); document.body.classList.remove('sc-on'); qs('sc-size').textContent = '↑'; }
qs('sc-open').addEventListener('click', openSheet);
qs('sc-close').addEventListener('click', closeSheet);
scrim.addEventListener('click', closeSheet);
qs('sc-size').addEventListener('click', function(){
  var full = sheet.classList.toggle('full');
  this.textContent = full ? '↓' : '↑';
});
qs('handle').addEventListener('click', function(){ sheet.classList.toggle('full'); });
document.querySelectorAll('.tab').forEach(function(el){
  el.addEventListener('click', function(){ setTab(el.getAttribute('data-t')); });
});

/* Passage picker */
var picker = qs('picker');
function openPicker(){ renderBooks(); picker.classList.add('open'); }
function closePicker(){ picker.classList.remove('open'); }
qs('picker-open').addEventListener('click', openPicker);
qs('pick-close').addEventListener('click', closePicker);
function renderBooks(){
  qs('pick-title').textContent = 'Go to passage';
  var ot = BOOKS.filter(function(b){ return (b.t||'OT') === 'OT'; });
  var nt = BOOKS.filter(function(b){ return b.t === 'NT'; });
  function rows(arr){ return arr.map(function(b){
    return '<div class="bookrow" onclick="renderChapters(' + b.n + ')"><span class="n">' + esc(b.name) + '</span><span class="ct">' + b.ch + ' chapters</span></div>';
  }).join(''); }
  qs('pick-body').innerHTML = '<div class="test-h">OLD TESTAMENT</div>' + rows(ot) + '<div class="test-h">NEW TESTAMENT</div>' + rows(nt);
  picker.scrollTop = 0;
}
function renderChapters(bn){
  var b = bookOf(bn);
  qs('pick-title').textContent = b.name;
  var html = '<div class="test-h" style="cursor:pointer" onclick="renderBooks()">← ALL BOOKS</div><div class="chgrid">';
  for (var i=1; i<=b.ch; i++) html += '<button class="chbtn" onclick="pickCh(' + bn + ',' + i + ')">' + i + '</button>';
  html += '</div>';
  qs('pick-body').innerHTML = html;
  picker.scrollTop = 0;
}
function pickCh(b, c){ closePicker(); closeSheet(); go(b, c); }

window.addEventListener('hashchange', function(){
  var s = loadState();
  if (CH && (CH.b !== s[0] || CH.c !== s[1])) go(s[0], s[1]);
});

/* reading progress + auto-hiding header */
(function(){
  var lastY = 0, hdr = document.getElementById('hdr'), bar = document.getElementById('progress');
  window.addEventListener('scroll', function(){
    var y = window.scrollY;
    var max = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = (max > 0 ? Math.min(100, y / max * 100) : 0) + '%';
    if (y > 140 && y > lastY + 6) hdr.classList.add('hide');
    else if (y < lastY - 6 || y < 140) hdr.classList.remove('hide');
    lastY = y;
  }, { passive: true });
})();

fetch('data/books.json').then(function(r){ return r.json(); }).then(function(d){
  BOOKS = d;
  var s = loadState();
  go(s[0], s[1]);
});
